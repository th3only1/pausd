<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />
  <link
    rel="icon"
    type="image/png"
    href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR-1zeTr7umcRr1dnuBASn_bMdIriD-0Ofmruatuu6ew-ks5dbp3iVof_8&s=10"
  />
  <title>My Apps</title>

  <style>
    :root {
      --board-size: min(92vw, 500px);
      --gap: clamp(7px, 2vw, 14px);
      --radius: clamp(7px, 2vw, 12px);
      --text: #776e65;
      --board: #bbada0;
      --empty: rgba(238, 228, 218, 0.35);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      padding: 22px 12px;
      background: #faf8ef;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      touch-action: manipulation;
      overscroll-behavior: none;
    }

    .game {
      width: var(--board-size);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      color: #776e65;
      font-size: clamp(42px, 13vw, 68px);
      line-height: 1;
      letter-spacing: -2px;
      font-weight: 900;
      text-shadow: 1px 2px 0 #d8cfc4;
    }

    .scores {
      display: flex;
      gap: 6px;
    }

    .score-box {
      min-width: 72px;
      padding: 7px 10px;
      border-radius: 6px;
      background: #bbada0;
      color: white;
      text-align: center;
      text-transform: uppercase;
      font-size: 10px;
      font-weight: bold;
    }

    .score {
      display: block;
      margin-top: 2px;
      font-size: 22px;
    }

    .intro {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      font-size: 14px;
      line-height: 1.35;
    }

    .intro p {
      margin: 0;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 11px 14px;
      background: #8f7a66;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.08s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    .board {
      position: relative;
      width: var(--board-size);
      height: var(--board-size);
      padding: var(--gap);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--gap);
      background: var(--board);
      border-radius: var(--radius);
      overflow: hidden;
      user-select: none;
      touch-action: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius);
      background: var(--empty);
      font-size: clamp(22px, 8vw, 42px);
      font-weight: bold;
      transition: transform 0.12s ease;
    }

    .tile-4 { background: #ede0c8; }
    .tile-8 { background: #f2b179; color: #f9f6f2; }
    .tile-16 { background: #f59563; color: #f9f6f2; }
    .tile-32 { background: #f67c5f; color: #f9f6f2; }
    .tile-64 { background: #f65e3b; color: #f9f6f2; }
