<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />
    <title>My Apps</title>
    <link rel="icon" type="image/x-icon" href="https://pbs.twimg.com/profile_images/1179529603624226818/oGF_v7IC.jpg">

  <style>
    :root {
      --board-size: min(92vw, 500px);
      --gap: clamp(7px, 2vw, 14px);
      --radius: clamp(7px, 2vw, 12px);
      --text: #776e65;
      --board: #bbada0;
      --empty: rgba(238, 228, 218, 0.35);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 22px 12px;
      background: #faf8ef;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      touch-action: manipulation;
    }

    .game {
      width: var(--board-size);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      color: #776e65;
      font-size: clamp(48px, 14vw, 76px);
      line-height: 0.9;
      letter-spacing: -4px;
    }

    .scores {
      display: flex;
      gap: 6px;
    }

    .score-box {
      min-width: 72px;
      padding: 7px 10px;
      border-radius: 6px;
      background: #bbada0;
      color: white;
      text-align: center;
      text-transform: uppercase;
      font-size: 10px;
      font-weight: bold;
    }

    .score {
      display: block;
      margin-top: 2px;
      font-size: 22px;
    }

    .intro {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      font-size: 14px;
      line-height: 1.35;
    }

    .intro p {
      margin: 0;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 11px 14px;
      background: #8f7a66;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.96);
    }

    .board {
      position: relative;
      width: var(--board-size);
      height: var(--board-size);
      padding: var(--gap);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--gap);
      background: var(--board);
      border-radius: var(--radius);
      overflow: hidden;
      user-select: none;
      touch-action: none;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius);
      background: var(--empty);
      font-size: clamp(22px, 8vw, 42px);
      font-weight: bold;
    }

    .tile-2 { background: #eee4da; }
    .tile-4 { background: #ede0c8; }
    .tile-8 { background: #f2b179; color: #f9f6f2; }
    .tile-16 { background: #f59563; color: #f9f6f2; }
    .tile-32 { background: #f67c5f; color: #f9f6f2; }
    .tile-64 { background: #f65e3b; color: #f9f6f2; }
    .tile-128 { background: #edcf72; color: #f9f6f2; font-size: clamp(18px, 6vw, 36px); }
    .tile-256 { background: #edcc61; color: #f9f6f2; font-size: clamp(18px, 6vw, 36px); }
    .tile-512 { background: #edc850; color: #f9f6f2; font-size: clamp(18px, 6vw, 36px); }
    .tile-1024,
    .tile-2048 {
      background: #edc53f;
      color: #f9f6f2;
      font-size: clamp(15px, 5vw, 30px);
    }

    .message {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(238, 228, 218, 0.82);
      text-align: center;
    }

    .message.show {
      display: flex;
    }

    .message h2 {
      margin: 0;
      color: #776e65;
      font-size: 38px;
    }

    .message p {
      margin: 0;
      font-weight: bold;
    }

    footer {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 380px) {
      body {
        padding-top: 14px;
      }

      .score-box {
        min-width: 62px;
        padding-inline: 6px;
      }

      .intro {
        font-size: 13px;
      }

      button {
        padding: 10px;
      }
    }
  </style>
</head>

<body>
  <main class="game">
    <header>
      <h1>2048</h1>

      <div class="scores">
        <div class="score-box">
          Score
          <span id="score" class="score">0</span>
        </div>

        <div class="score-box">
          Best
          <span id="best" class="score">0</span>
        </div>
      </div>
    </header>

    <section class="intro">
      <p>Join the numbers and get to <strong>2048!</strong></p>
      <button id="newGame">New Game</button>
    </section>

    <section id="board" class="board" aria-label="2048 game board">
      <div id="message" class="message">
        <h2 id="messageTitle">Game Over!</h2>
        <p id="messageText">No more moves available.</p>
        <button id="tryAgain">Try Again</button>
      </div>
    </section>

    <footer>
      Use your <strong>arrow keys</strong> or <strong>swipe</strong> to move the tiles.
    </footer>
  </main>

  <script>
    const boardElement = document.getElementById("board");
    const scoreElement = document.getElementById("score");
    const bestElement = document.getElementById("best");
    const messageElement = document.getElementById("message");
    const messageTitle = document.getElementById("messageTitle");
    const messageText = document.getElementById("messageText");

    const SIZE = 4;
    let board = [];
    let score = 0;
    let best = Number(localStorage.getItem("best2048") || 0);
    let won = false;
    let gameOver = false;
    let startX = 0;
    let startY = 0;

    bestElement.textContent = best;

    function emptyBoard() {
      return Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    }

    function startGame() {
      board = emptyBoard();
      score = 0;
      won = false;
      gameOver = false;
      hideMessage();
      addRandomTile();
      addRandomTile();
      update();
    }

    function addRandomTile() {
      const empty = [];

      for (let row = 0; row < SIZE; row++) {
        for (let col = 0; col < SIZE; col++) {
          if (board[row][col] === 0) {
            empty.push({ row, col });
          }
        }
      }

      if (!empty.length) return;

      const spot = empty[Math.floor(Math.random() * empty.length)];
      board[spot.row][spot.col] = Math.random() < 0.9 ? 2 : 4;
    }

    function update() {
      boardElement.querySelectorAll(".cell").forEach(cell => cell.remove());

      for (let row = 0; row < SIZE; row++) {
        for (let col = 0; col < SIZE; col++) {
          const cell = document.createElement("div");
          const value = board[row][col];

          cell.className = "cell";
          if (value) {
            cell.classList.add(`tile-${value}`);
            cell.textContent = value;
          }

          boardElement.appendChild(cell);
        }
      }

      scoreElement.textContent = score;

      if (score > best) {
        best = score;
        bestElement.textContent = best;
        localStorage.setItem("best2048", best);
      }
    }

    function slideLine(line) {
      const values = line.filter(value => value !== 0);
      const result = [];
      let gained = 0;

      for (let i = 0; i < values.length; i++) {
        if (values[i] === values[i + 1]) {
          const merged = values[i] * 2;
          result.push(merged);
          gained += merged;
          i++;
        } else {
          result.push(values[i]);
        }
      }

      while (result.length < SIZE) result.push(0);

      return { line: result, gained };
    }

    function move(direction) {
      if (gameOver) return;

      const oldBoard = JSON.stringify(board);
      let gained = 0;

      if (direction === "left" || direction === "right") {
        for (let row = 0; row < SIZE; row++) {
          let line = [...board[row]];

          if (direction === "right") line.reverse();

          const result = slideLine(line);
          line = result.line;
          gained += result.gained;

          if (direction === "right") line.reverse();

          board[row] = line;
        }
      } else {
        for (let col = 0; col < SIZE; col++) {
          let line = [];

          for (let row = 0; row < SIZE; row++) {
            line.push(board[row][col]);
          }

          if (direction === "down") line.reverse();

          const result = slideLine(line);
          line = result.line;
          gained += result.gained;

          if (direction === "down") line.reverse();

          for (let row = 0; row < SIZE; row++) {
            board[row][col] = line[row];
          }
        }
      }

      if (JSON.stringify(board) === oldBoard) return;

      score += gained;
      addRandomTile();
      update();

      if (!won && board.flat().includes(2048)) {
        won = true;
        showMessage("You Win!", "You reached 2048!");
      } else if (!canMove()) {
        gameOver = true;
        showMessage("Game Over!", "No more moves available.");
      }
    }

    function canMove() {
      for (let row = 0; row < SIZE; row++) {
        for (let col = 0; col < SIZE; col++) {
          if (board[row][col] === 0) return true;

          if (
            col < SIZE - 1 &&
            board[row][col] === board[row][col + 1]
          ) {
            return true;
          }

          if (
            row < SIZE - 1 &&
            board[row][col] === board[row + 1][col]
          ) {
            return true;
          }
        }
      }

      return false;
    }

    function showMessage(title, text) {
      messageTitle.textContent = title;
      messageText.textContent = text;
      messageElement.classList.add("show");
    }

    function hideMessage() {
      messageElement.classList.remove("show");
    }

    document.addEventListener("keydown", event => {
      const keys = {
        ArrowLeft: "left",
        ArrowRight: "right",
        ArrowUp: "up",
        ArrowDown: "down"
      };

      if (keys[event.key]) {
        event.preventDefault();
        move(keys[event.key]);
      }
    });

    boardElement.addEventListener("touchstart", event => {
      const touch = event.changedTouches[0];
      startX = touch.clientX;
      startY = touch.clientY;
    }, { passive: true });

    boardElement.addEventListener("touchend", event => {
      const touch = event.changedTouches[0];
      const distanceX = touch.clientX - startX;
      const distanceY = touch.clientY - startY;

      if (Math.max(Math.abs(distanceX), Math.abs(distanceY)) < 30) return;

      if (Math.abs(distanceX) > Math.abs(distanceY)) {
        move(distanceX > 0 ? "right" : "left");
      } else {
        move(distanceY > 0 ? "down" : "up");
      }
    }, { passive: true });

    document.getElementById("newGame").addEventListener("click", startGame);
    document.getElementById("tryAgain").addEventListener("click", startGame);

    startGame();
  </script>
</body>
</html>
