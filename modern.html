
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ModernClient Launcher</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cinzel+Decorative:wght@700&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --gold-light:  #fff5c0;
      --gold:        #f5c842;
      --gold-mid:    #d4a017;
      --gold-dark:   #8b6914;
      --white-pure:  #ffffff;
      --white-glow:  rgba(255, 255, 255, 0.85);
      --sky-top:     #b8d4f8;
      --sky-mid:     #ddeeff;
      --sky-bot:     #fff8e7;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: 'Cinzel', serif;
      min-height: 100vh;
      background: linear-gradient(180deg,
        #ffffff 0%,
        #fff9e6 35%,
        #fce87a 70%,
        #f5c842 100%
      );
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ── Light rays ── */
    .rays {
      position: fixed;
      top: -10%;
      left: 50%;
      transform: translateX(-50%);
      width: 200vw;
      height: 110vh;
      pointer-events: none;
      z-index: 0;
      background: conic-gradient(
        from 180deg at 50% 0%,
        transparent 0deg,
        rgba(255,245,160,0.18) 5deg,
        transparent 10deg,
        rgba(255,245,160,0.12) 16deg,
        transparent 22deg,
        rgba(255,245,160,0.20) 28deg,
        transparent 34deg,
        rgba(255,245,160,0.10) 40deg,
        transparent 48deg,
        rgba(255,245,160,0.22) 54deg,
        transparent 60deg,
        rgba(255,245,160,0.14) 66deg,
        transparent 72deg,
        rgba(255,245,160,0.18) 78deg,
        transparent 84deg,
        rgba(255,245,160,0.12) 90deg,
        transparent 180deg
      );
      animation: rayRotate 40s linear infinite;
      opacity: 0.9;
    }

    @keyframes rayRotate {
      from { transform: translateX(-50%) rotate(0deg); }
      to   { transform: translateX(-50%) rotate(360deg); }
    }

    /* ── Floating particles ── */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, #fff9c4 0%, rgba(245,200,66,0.6) 60%, transparent 100%);
      animation: particleFloat linear infinite;
    }

    @keyframes particleFloat {
      0%   { transform: translateY(0)    rotate(0deg);   opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.7; }
      100% { transform: translateY(-110vh) rotate(720deg); opacity: 0; }
    }

    /* ── Main card ── */
    .card {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      padding: 56px 64px 52px;
      background: linear-gradient(160deg,
        rgba(255,255,255,0.92) 0%,
        rgba(255,248,200,0.85) 50%,
        rgba(255,255,255,0.90) 100%
      );
      border: 2px solid rgba(212,160,23,0.45);
      border-radius: 24px;
      box-shadow:
        0 0  80px rgba(245,200,66,0.25),
        0 0 160px rgba(255,255,255,0.50),
        0  8px  40px rgba(0,0,0,0.12),
        inset 0 1px 0 rgba(255,255,255,0.95);
      backdrop-filter: blur(18px);
      max-width: 540px;
      width: 90vw;
      text-align: center;
    }

    /* Gold divider line */
    .divider {
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg,
        transparent 0%,
        var(--gold-mid) 20%,
        var(--gold) 50%,
        var(--gold-mid) 80%,
        transparent 100%
      );
      margin: 20px 0;
      border-radius: 1px;
    }

    /* ── Logo ── */
    .logo-wrap {
      margin-bottom: 10px;
    }

    .logo-img {
      max-width: 340px;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 2px 16px rgba(212,160,23,0.55));
    }

    .title-sub {
      font-family: 'Cinzel', serif;
      font-size: clamp(0.75rem, 2vw, 0.95rem);
      font-weight: 400;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold-dark);
      opacity: 0.8;
      margin-top: 6px;
    }

    /* ── Buttons ── */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      margin-top: 4px;
    }

    .btn {
      position: relative;
      width: 100%;
      padding: 18px 24px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: clamp(0.9rem, 2.5vw, 1.05rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      overflow: hidden;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.35) 0%,
        transparent 60%
      );
      border-radius: inherit;
      pointer-events: none;
    }

    .btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 40%;
      height: 200%;
      background: rgba(255,255,255,0.35);
      transform: skewX(-20deg);
      transition: left 0.4s ease;
      pointer-events: none;
    }

    .btn:hover::after {
      left: 130%;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn:active {
      transform: translateY(0px);
    }

    /* JavaScript button */
    .btn-js {
      background: linear-gradient(135deg,
        #f0b800 0%,
        #f5d050 25%,
        #fce97a 45%,
        #f5c842 65%,
        #d4940c 100%
      );
      color: #3a2400;
      box-shadow:
        0 4px 20px rgba(212,148,12,0.50),
        0 1px  0  rgba(255,255,255,0.6) inset,
        0 -2px 0  rgba(140,100,0,0.3) inset;
      border: 1px solid rgba(180,120,0,0.3);
    }

    .btn-js:hover {
      box-shadow:
        0 8px 32px rgba(212,148,12,0.65),
        0 1px  0  rgba(255,255,255,0.6) inset,
        0 -2px 0  rgba(140,100,0,0.3) inset;
    }

    /* WASM button */
    .btn-wasm {
      background: linear-gradient(135deg,
        #ffffff 0%,
        #fff8d0 30%,
        #fff5b8 50%,
        #fffde0 70%,
        #f5e8b0 100%
      );
      color: #6b4e00;
      box-shadow:
        0 4px 20px rgba(200,170,80,0.35),
        0 1px  0  rgba(255,255,255,0.9) inset,
        0 -2px 0  rgba(180,150,60,0.2) inset;
      border: 1px solid rgba(212,160,23,0.45);
    }

    .btn-wasm:hover {
      box-shadow:
        0 8px 32px rgba(200,170,80,0.55),
        0 1px  0  rgba(255,255,255,0.9) inset,
        0 -2px 0  rgba(180,150,60,0.2) inset;
    }

    .btn-icon {
      margin-right: 10px;
      font-style: normal;
      font-size: 1.1em;
    }

    /* ── Footer note ── */
    .footer-note {
      margin-top: 18px;
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      color: rgba(120,90,20,0.6);
      text-transform: uppercase;
    }

    /* ── Shine pulse on card ── */
    @keyframes cardShine {
      0%, 100% { box-shadow:
        0 0  80px rgba(245,200,66,0.22),
        0 0 160px rgba(255,255,255,0.45),
        0  8px  40px rgba(0,0,0,0.12),
        inset 0 1px 0 rgba(255,255,255,0.95); }
      50% { box-shadow:
        0 0  90px rgba(245,200,66,0.38),
        0 0 200px rgba(255,255,255,0.60),
        0  8px  40px rgba(0,0,0,0.12),
        inset 0 1px 0 rgba(255,255,255,0.95); }
    }

    .card {
      animation: cardShine 5s ease-in-out infinite;
    }

    /* ── Music toggle button ── */
    .music-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 100;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1.5px solid rgba(212,160,23,0.55);
      background: linear-gradient(135deg,
        rgba(255,255,255,0.85) 0%,
        rgba(255,248,200,0.80) 100%
      );
      box-shadow: 0 4px 18px rgba(212,148,12,0.35), 0 1px 0 rgba(255,255,255,0.8) inset;
      cursor: pointer;
      font-size: 1.3rem;
      color: var(--gold-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      backdrop-filter: blur(8px);
    }

    .music-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 24px rgba(212,148,12,0.5), 0 1px 0 rgba(255,255,255,0.8) inset;
    }

    .music-btn.muted #music-icon::after {
      content: '';
    }
  </style>
</head>
<body>

  <!-- Light rays -->
  <div class="rays"></div>

  <!-- Background music (replace song.mp3 with your file name) -->
  <audio id="bg-audio" src="07. otherside.mp3" loop preload="auto"></audio>

  <!-- Music toggle -->
  <button class="music-btn" id="music-btn" onclick="toggleMusic()" title="Toggle music">
    <span id="music-icon">♪</span>
  </button>

  <!-- Floating gold particles -->
  <div class="particles" id="particles"></div>

  <!-- Main launcher card -->
  <main class="card">

    <div class="logo-wrap">
      <img
        src="https://modernclient.online/assets/title/modernclient_title.png?v=20260319"
        alt="ModernClient"
        class="logo-img"
      />
    </div>

    <p class="title-sub">Eaglercraft Launcher</p>
    <div class="divider"></div>

    <div class="buttons">
      <button class="btn btn-js" onclick="launch('javascript')">
        <em class="btn-icon">⚡</em>Launch Javascript
      </button>
      <button class="btn btn-wasm" onclick="launch('wasm')">
        <em class="btn-icon">✦</em>Launch WASM
      </button>
    </div>

    <p class="footer-note">Select runtime to begin your journey</p>
  </main>

  <script>
    // ── Spawn floating particles ──
    const container = document.getElementById('particles');
    const sizes = [4, 5, 6, 7, 8, 10];
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const sz = sizes[Math.floor(Math.random() * sizes.length)];
      p.style.cssText = `
        width: ${sz}px;
        height: ${sz}px;
        left: ${Math.random() * 100}vw;
        bottom: -${sz}px;
        animation-duration: ${12 + Math.random() * 18}s;
        animation-delay: ${Math.random() * 20}s;
        opacity: 0;
      `;
      container.appendChild(p);
    }

    // ── Music toggle ──
    const audio = document.getElementById('bg-audio');
    const musicBtn = document.getElementById('music-btn');
    const musicIcon = document.getElementById('music-icon');
    let playing = false;

    function startMusic() {
      audio.play().then(() => {
        playing = true;
        musicIcon.textContent = '♪';
        musicBtn.title = 'Mute music';
      }).catch(() => {});
    }

    function toggleMusic() {
      if (playing) {
        audio.pause();
        playing = false;
        musicIcon.textContent = '🔇';
        musicBtn.title = 'Play music';
      } else {
        startMusic();
      }
    }

    // Autoplay as soon as the user interacts with the page (browser policy)
    document.addEventListener('click', function tryAutoplay() {
      if (!playing) startMusic();
      document.removeEventListener('click', tryAutoplay);
    }, { once: true });

    // Also attempt immediate autoplay (works if browser allows it)
    startMusic();

    // ── Define your redirect URLs here ──
    const LINKS = {
      javascript: 'https://java.modernclient.online',
      wasm:       'https://wasm.modernclient.online',
    };

    // ── Launch handlers ──
    function launch(type) {
      const btn = document.querySelector(type === 'javascript' ? '.btn-js' : '.btn-wasm');

      btn.textContent = '✦  Loading…';
      btn.style.opacity = '0.75';
      btn.disabled = true;

      setTimeout(() => {
        window.location.href = LINKS[type];
      }, 900);
    }
  </script>

</body>
</html>
